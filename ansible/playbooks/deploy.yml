---
- name: Deploy Frontend Application
  hosts: webservers
  become: yes
  tasks:
    - name: Create frontend directory
      file:
        path: /var/www/html
        state: directory
        mode: '0755'
    
    - name: Copy frontend files
      copy:
        src: ../../frontend/build/
        dest: /var/www/html/
        mode: '0755'
        remote_src: no
    
    - name: Start frontend service
      service:
        name: nginx
        state: started
        enabled: yes

- name: Deploy Backend Application
  hosts: backend
  become: yes
  tasks:
    - name: Create backend directory
      file:
        path: /opt/backend
        state: directory
        mode: '0755'
    
    - name: Copy backend files
      copy:
        src: ../../backend/
        dest: /opt/backend/
        mode: '0755'
        remote_src: no
    
    - name: Start backend service
      service:
        name: backend
        state: restarted
        enabled: yes

- name: Deploy Admin Panel
  hosts: admin
  become: yes
  tasks:
    - name: Create admin directory
      file:
        path: /var/www/admin
        state: directory
        mode: '0755'
    
    - name: Copy admin files
      copy:
        src: ../../admin/build/
        dest: /var/www/admin/
        mode: '0755'
        remote_src: no
    
    - name: Start admin service
      service:
        name: admin
        state: restarted
        enabled: yes